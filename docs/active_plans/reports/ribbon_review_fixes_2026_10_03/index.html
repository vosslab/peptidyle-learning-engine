<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instructor Ribbon review fixes</title><style>body{margin:24px;background:#eceeed;color:#202826;font:16px system-ui}h1{font-size:1.4rem}label{margin-right:16px}select{font:inherit;padding:6px}main{display:grid;gap:20px;margin-top:24px}figure{margin:0}figcaption{font-weight:650;margin-bottom:8px}img{display:block;width:100%;height:auto}a{color:#175846}</style><h1>Instructor Ribbon review fixes</h1><p>Wider shoulders, simpler content edges, and operable overflow controls. Theme surface contrast is preserved.</p><label>Theme <select id="theme"><option value="tundra">Tundra</option><option value="forest">Forest</option><option value="desert">Desert</option><option value="grass">Grass</option><option value="arctic">Arctic</option><option value="ocean">Ocean</option><option value="tropical">Tropical</option><option value="coral-reef">Coral Reef</option><option value="swamp">Swamp</option><option value="underground">Underground</option><option value="salt-marsh">Salt Marsh</option><option value="wetland">Wetland</option><option value="sea-floor">Sea Floor</option><option value="magma">Magma</option><option value="beach">Beach</option></select></label><label>Mode <select id="mode"><option>light</option><option>dark</option></select></label><main><figure><figcaption>Before</figcaption><img id="before" alt="Ribbon before refinement"></figure><figure><figcaption>After</figcaption><img id="after" alt="Ribbon after refinement"></figure></main><p><a href="../../../screenshots/instructor/stacked-screenshot.webp">Current Instructor crop stack</a></p><script>const theme=document.querySelector('#theme'),mode=document.querySelector('#mode');function update(){for(const state of ['before','after'])document.querySelector('#'+state).src=state+'/final_'+theme.value+'_'+mode.value+'.png'}theme.onchange=mode.onchange=update;update();</script></html>
