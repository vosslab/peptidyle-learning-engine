# Current stable toolchain.
#
# The repository follows the owner's latest-version policy rather than pinning
# a compiler release. The wasm-bindgen library and CLI support crate still
# resolve together through Cargo.lock and are validated by the real WASM gate.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
