# compose.yaml - common local and disposable stack topology.
x-ple-disposable-capability-label: &ple-disposable-capability-label
  org.peptidyle.disposable.capability-sha256: "${PLE_DISPOSABLE_CAPABILITY_SHA256:-normal}"
  # The browser overlay selects live-demo-browser. Ordinary local stacks retain
  # this safe non-browser owner value.
  org.peptidyle.e2e.owner: "${PLE_E2E_OWNER:-normal}"

services:
  # Rootless Podman creates a new named volume with an engine-owned top-level
  # directory.  The two upstream stateful images run as fixed, unprivileged
  # UIDs, so normalize the PostgreSQL root and MinIO tree before either daemon
  # starts. The MinIO repair preserves retained local data created by an older
  # root-running image; PostgreSQL already owns its mode-0700 descendants. This
  # one-shot task has no network, writable root filesystem, or authority over
  # application data after it exits.
  local-data-volume-permissions:
    labels: *ple-disposable-capability-label
    image: docker.io/library/alpine@sha256:${PLE_SECRET_INIT_IMAGE_SHA256:?set PLE_SECRET_INIT_IMAGE_SHA256 to the selected official Alpine Linux image manifest digest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /var/lib/postgresql/data /data
        chown 999:999 /var/lib/postgresql/data
        chown -R 10001:10001 /data
    user: "0:0"
    volumes:
      - ple_pgdata:/var/lib/postgresql/data
      - ple_miniodata:/data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # The sole elevated operation is assigning the fixed daemon owners to
      # the two mounted data directories. Rootless container root has no host
      # root authority.
      - CHOWN
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    cpus: "0.10"
    mem_limit: 32m
    pids_limit: 16
    restart: "no"

  postgres:
    labels: *ple-disposable-capability-label
    image: docker.io/library/postgres@sha256:${PLE_POSTGRES_IMAGE_SHA256:?set PLE_POSTGRES_IMAGE_SHA256 to the selected official PostgreSQL 17 Linux image manifest digest}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-peptidyle}
    volumes:
      - ple_pgdata:/var/lib/postgresql/data
    depends_on:
      local-data-volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${PLE_POSTGRES_HOST_PORT:-5432}:5432"
    # The official image accepts an explicit user once its data directory is
    # owned by that user. This prevents the entrypoint from retaining root
    # while it starts the server.
    user: "999:999"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=1777
    cpus: "2.0"
    mem_limit: 1g
    pids_limit: 128
    restart: on-failure

  # The controller runs this profile-only job before application services. It
  # keeps migrations on the Compose data network, avoiding a host port-forward
  # dependency while retaining the same embedded migration authority.
  database-migrator:
    labels: *ple-disposable-capability-label
    profiles: ["migration"]
    image: localhost/peptidyle-learning-engine:local-database-migrator
    build:
      context: ..
      dockerfile: containers/Containerfile.api
      target: database-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLE_MIGRATION_DATABASE_URL: ${PLE_MIGRATION_DATABASE_URL:-}
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 64
    restart: "no"

  # Invoked explicitly by local_stack_control.lifecycle before PostgreSQL starts.  A
  # PostgreSQL data directory is not forward/backward compatible across major
  # versions, so the guard refuses a populated volume whose declared major is
  # not the pinned PostgreSQL 17 contract.  It mounts the data read-only.
  postgres-major-guard:
    labels: *ple-disposable-capability-label
    image: docker.io/library/postgres@sha256:${PLE_POSTGRES_IMAGE_SHA256:?set PLE_POSTGRES_IMAGE_SHA256 to the selected official PostgreSQL 17 Linux image manifest digest}
    profiles: ["maintenance"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        version_file=/var/lib/postgresql/data/PG_VERSION
        if [ ! -e "$${version_file}" ]; then
          exit 0
        fi
        if [ ! -f "$${version_file}" ]; then
          echo "PostgreSQL data volume has an invalid PG_VERSION path" >&2
          exit 1
        fi
        actual_major="$$(tr -d '\\r\\n' < "$${version_file}")"
        if [ "$${actual_major}" != "17" ]; then
          echo "PostgreSQL data volume requires major $${actual_major}; local stack is pinned to PostgreSQL 17" >&2
          exit 1
        fi
    volumes:
      - ple_pgdata:/var/lib/postgresql/data:ro
    network_mode: none
    read_only: true
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.10"
    mem_limit: 32m
    pids_limit: 16
    restart: "no"

  minio:
    labels: *ple-disposable-capability-label
    image: quay.io/minio/minio@sha256:${PLE_MINIO_IMAGE_SHA256:?set PLE_MINIO_IMAGE_SHA256 to the selected official MinIO Linux image manifest digest}
    command: server /data --console-address ":9001"
    volumes:
      - ple_miniodata:/data
    depends_on:
      local-data-volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${PLE_MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${PLE_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    # MinIO documents `--user` support when its data directory is writable.
    # Keep its transient home on an explicit non-executable tmpfs; only /data
    # remains durable and writable.
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the env file}
      HOME: /tmp
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    restart: on-failure

  createbuckets:
    labels: *ple-disposable-capability-label
    image: quay.io/minio/mc@sha256:${PLE_MINIO_MC_IMAGE_SHA256:?set PLE_MINIO_MC_IMAGE_SHA256 to the selected official MinIO Client Linux image manifest digest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the env file}
      # These are projected only into this privileged local bootstrap and the
      # one-shot publisher.  API and worker never receive this identity.
      PLE_PUBLISHER_S3_ACCESS_KEY_ID: ${PLE_PUBLISHER_S3_ACCESS_KEY_ID:?set publisher storage access key in the env file}
      PLE_PUBLISHER_S3_SECRET_ACCESS_KEY: ${PLE_PUBLISHER_S3_SECRET_ACCESS_KEY:?set publisher storage secret in the env file}
      PLE_NATIVE_PLE_WORKER_S3_ACCESS_KEY_ID: ${PLE_NATIVE_PLE_WORKER_S3_ACCESS_KEY_ID:?set native PLE worker storage access key in the env file}
      PLE_NATIVE_PLE_WORKER_S3_SECRET_ACCESS_KEY: ${PLE_NATIVE_PLE_WORKER_S3_SECRET_ACCESS_KEY:?set native PLE worker storage secret in the env file}
      PLE_WEBWORK_WORKER_S3_ACCESS_KEY_ID: ${PLE_WEBWORK_WORKER_S3_ACCESS_KEY_ID:?set WeBWorK worker storage access key in the env file}
      PLE_WEBWORK_WORKER_S3_SECRET_ACCESS_KEY: ${PLE_WEBWORK_WORKER_S3_SECRET_ACCESS_KEY:?set WeBWorK worker storage secret in the env file}
      PLE_PUBLISHER_RESTRICTED_ASSET_PATH: ${PLE_PUBLISHER_RESTRICTED_ASSET_PATH:?set publisher restricted asset path in the env file}
      PLE_PUBLISHER_PUBLIC_ASSET_PATH: ${PLE_PUBLISHER_PUBLIC_ASSET_PATH:?set publisher public asset path in the env file}
      HOME: /tmp
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/public-assets
        mc anonymous set download local/public-assets
        mc mb --ignore-existing local/private-content
        mc mb --ignore-existing local/student-records
        mc mb --ignore-existing local/temp-processing
        policy_file=$$(mktemp /tmp/public-asset-publisher-policy.XXXXXX)
        trap 'rm -f "$$policy_file"' EXIT
        chmod 600 "$$policy_file"
        cat >"$$policy_file" <<EOF
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::private-content/$${PLE_PUBLISHER_RESTRICTED_ASSET_PATH}"]},
          {"Effect":"Allow","Action":["s3:GetObject","s3:GetObjectTagging"],"Resource":["arn:aws:s3:::public-assets/$${PLE_PUBLISHER_PUBLIC_ASSET_PATH}"]},
          {"Effect":"Allow","Action":["s3:PutObject","s3:PutObjectTagging"],"Resource":["arn:aws:s3:::public-assets/$${PLE_PUBLISHER_PUBLIC_ASSET_PATH}"],"Condition":{"StringEquals":{"s3:RequestObjectTag/ple-published-immutable":"true"}}}
        ]}
        EOF
        # A retained local MinIO volume may carry a former policy with this
        # name. Remove then recreate it from the fixed JSON above; a failed
        # removal or recreation leaves the bootstrap failed rather than
        # attaching a publisher user to an unverified grant.
        if mc admin policy info local ple-public-asset-publisher >/dev/null 2>&1; then
          mc admin policy remove local ple-public-asset-publisher
        fi
        mc admin policy create local ple-public-asset-publisher "$$policy_file"
        mc admin policy info local ple-public-asset-publisher >/dev/null
        mc admin user add local "$${PLE_PUBLISHER_S3_ACCESS_KEY_ID}" "$${PLE_PUBLISHER_S3_SECRET_ACCESS_KEY}"
        mc admin policy attach local ple-public-asset-publisher --user "$${PLE_PUBLISHER_S3_ACCESS_KEY_ID}"
        native_policy=$$(mktemp /tmp/native-ple-worker-policy.XXXXXX)
        trap 'rm -f "$$policy_file" "$$native_policy"' EXIT
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::private-content/questions/*"]}]}' >"$$native_policy"
        if mc admin policy info local ple-native-ple-grading-worker >/dev/null 2>&1; then mc admin policy remove local ple-native-ple-grading-worker; fi
        mc admin policy create local ple-native-ple-grading-worker "$$native_policy"
        mc admin user add local "$${PLE_NATIVE_PLE_WORKER_S3_ACCESS_KEY_ID}" "$${PLE_NATIVE_PLE_WORKER_S3_SECRET_ACCESS_KEY}"
        mc admin policy attach local ple-native-ple-grading-worker --user "$${PLE_NATIVE_PLE_WORKER_S3_ACCESS_KEY_ID}"
        webwork_policy=$$(mktemp /tmp/webwork-worker-policy.XXXXXX)
        trap 'rm -f "$$policy_file" "$$native_policy" "$$webwork_policy"' EXIT
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::private-content/questions/*"]}]}' >"$$webwork_policy"
        if mc admin policy info local ple-webwork-grading-worker >/dev/null 2>&1; then mc admin policy remove local ple-webwork-grading-worker; fi
        mc admin policy create local ple-webwork-grading-worker "$$webwork_policy"
        mc admin user add local "$${PLE_WEBWORK_WORKER_S3_ACCESS_KEY_ID}" "$${PLE_WEBWORK_WORKER_S3_SECRET_ACCESS_KEY}"
        mc admin policy attach local ple-webwork-grading-worker --user "$${PLE_WEBWORK_WORKER_S3_ACCESS_KEY_ID}"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cpus: "0.10"
    # Known-length bootstrap objects use a private tmpfs file and a single PUT.
    # This keeps the Go client bounded without unknown-size multipart buffers.
    mem_limit: 256m
    pids_limit: 32
    restart: "no"

  # Copies host-owned identity capabilities into a private volume as the
  # API's fixed runtime UID. Raw secrets never enter the API environment.
  identity-secret-init:
    labels: *ple-disposable-capability-label
    image: docker.io/library/alpine@sha256:${PLE_SECRET_INIT_IMAGE_SHA256:?set PLE_SECRET_INIT_IMAGE_SHA256 to the selected official Alpine Linux image manifest digest}
    volumes:
      - type: bind
        source: ${PLE_INVITATION_TOKEN_SECRET_HOST_FILE:?set PLE_INVITATION_TOKEN_SECRET_HOST_FILE to an operator-created mode-0600 file containing unpadded base64url for exactly 32 secret bytes}
        target: /run/source/invitation_token_secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLE_QUESTION_ID_SECRET_HOST_FILE:?set PLE_QUESTION_ID_SECRET_HOST_FILE to an operator-created mode-0600 file containing unpadded base64url for exactly 32 secret bytes}
        target: /run/source/question_id_secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # This controller-written attestation is copied into the existing
        # private runtime volume after the renderer has passed its probe.
        source: ${PLE_WEBWORK_RENDERER_VERSION_FILE:?set PLE_WEBWORK_RENDERER_VERSION_FILE in the env file}
        target: /run/source/question-renderer-version
        read_only: true
        bind:
          create_host_path: false
      - ple_identity_runtime:/run/ple-secrets
    command:
      [
        "/bin/sh",
        "-ec",
        "cp /run/source/invitation_token_secret /run/ple-secrets/invitation_token_secret; cp /run/source/question_id_secret /run/ple-secrets/question_id_secret; cp /run/source/question-renderer-version /run/ple-secrets/question-renderer-version; chmod 600 /run/ple-secrets/invitation_token_secret /run/ple-secrets/question_id_secret /run/ple-secrets/question-renderer-version; chown 10001:10001 /run/ple-secrets/invitation_token_secret /run/ple-secrets/question_id_secret /run/ple-secrets/question-renderer-version",
      ]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    cpus: "0.10"
    mem_limit: 32m
    pids_limit: 16
    restart: "no"

  api:
    labels: *ple-disposable-capability-label
    # `api` is the sole Compose build owner for the shared Rust application
    # image. The worker consumes this exact local image below, which avoids
    # concurrent duplicate Cargo builds on constrained Podman machines.
    image: ${PLE_APPLICATION_IMAGE:-localhost/peptidyle-learning-engine:local}
    build:
      context: ..
      dockerfile: containers/Containerfile.api
      target: production
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      identity-secret-init:
        condition: service_completed_successfully
      webwork-renderer:
        condition: service_healthy
    environment:
      PLE_BIND_ADDR: 0.0.0.0:3000
      PLE_BROWSER_ORIGIN: ${PLE_BROWSER_ORIGIN:?set PLE_BROWSER_ORIGIN in the env file}
      # The controller selects the disposable plaintext topology. The server
      # uses this only for its local transport attestation path; its service
      # login and database authority remain unchanged.
      PLE_STORAGE_TOPOLOGY: ${PLE_STORAGE_TOPOLOGY:?set PLE_STORAGE_TOPOLOGY in the env file}
      # Service Login Setup replaces this fail-closed sentinel with the Local
      # Stack Controller-generated API login URL before the API can connect.
      DATABASE_URL: ${PLE_API_DATABASE_URL:-postgres://ple_api_login:service-login-setup-required@postgres:5432/${POSTGRES_DB:-peptidyle}}
      PLE_S3_ENDPOINT: http://minio:9000
      PLE_S3_REGION: us-east-1
      PLE_PUBLIC_ASSETS_BUCKET: public-assets
      PLE_PRIVATE_CONTENT_BUCKET: private-content
      PLE_STUDENT_RECORDS_BUCKET: student-records
      PLE_TEMP_PROCESSING_BUCKET: temp-processing
      PLE_PUBLIC_ASSET_BASE_URL: ${PLE_PUBLIC_ASSET_BASE_URL:?set PLE_PUBLIC_ASSET_BASE_URL in the env file}
      PLE_INVITATION_TOKEN_SECRET_FILE: /run/ple-secrets/invitation_token_secret
      PLE_QUESTION_ID_SECRET_FILE: /run/ple-secrets/question_id_secret
      PLE_WEBWORK_RENDERER_BASE_URL: http://webwork-renderer:3000/
      PLE_WEBWORK_REQUEST_TIMEOUT_SECONDS: ${PLE_WEBWORK_REQUEST_TIMEOUT_SECONDS:-15}
      PLE_WEBWORK_MAX_RESPONSE_BYTES: ${PLE_WEBWORK_MAX_RESPONSE_BYTES:-1048576}
      PLE_WEBWORK_RENDERER_ID: ${PLE_WEBWORK_RENDERER_ID:-vosslab-webwork-pg-renderer}
      # The controller writes this attestation only after it has proved the
      # selected renderer.  It is private API configuration, never browser
      # data or renderer configuration.
      PLE_WEBWORK_RENDERER_VERSION_FILE: /run/ple-secrets/question-renderer-version
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - type: volume
        source: ple_identity_runtime
        target: /run/ple-secrets
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/peptidyle-api", "--health-probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # The image itself already selects UID 10001. Declare the runtime
    # containment here too so an orchestrator cannot silently widen it.
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    restart: on-failure
    # The application stops accepting work then permits a 30-second graceful
    # drain.  Leave explicit orchestrator margin so it cannot SIGKILL a
    # request that the application has legitimately admitted.
    stop_grace_period: 45s
    networks:
      - default
      - renderer_private
      - gateway_api
      # API-only outbound access is needed only for reviewed providers such as
      # SMTP and iMathAS. Storage and renderer traffic remain private.
      - api_outbound

  # The worker has one database login and no browser, gateway, object-store,
  # renderer, or outbound network authority. Its private non-HTTP readiness
  # socket lets the API report M2 dependency state without a public route.
  # M3 supplies typed procedures and lease protocol; it performs no queue work.
  worker:
    labels: *ple-disposable-capability-label
    image: ${PLE_APPLICATION_IMAGE:-localhost/peptidyle-learning-engine:local}
    command: ["--worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLE_STORAGE_TOPOLOGY: ${PLE_STORAGE_TOPOLOGY:?set PLE_STORAGE_TOPOLOGY in the env file}
      # Service Login Setup replaces this fail-closed sentinel before the
      # worker starts. The worker never receives the API login URL.
      DATABASE_URL: ${PLE_WORKER_DATABASE_URL:-postgres://ple_worker_login:service-login-setup-required@postgres:5432/${POSTGRES_DB:-peptidyle}}
    healthcheck:
      test: ["CMD", "/usr/local/bin/peptidyle-api", "--worker", "--health-probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    restart: on-failure
    stop_grace_period: 30s
    networks:
      - default

  native-ple-worker:
    labels: *ple-disposable-capability-label
    image: ${PLE_APPLICATION_IMAGE:-localhost/peptidyle-learning-engine:local}
    command: ["--native-ple-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      PLE_STORAGE_TOPOLOGY: ${PLE_STORAGE_TOPOLOGY:?set PLE_STORAGE_TOPOLOGY in the env file}
      DATABASE_URL: ${PLE_NATIVE_PLE_WORKER_DATABASE_URL:-postgres://ple_native_ple_worker_login:service-login-setup-required@postgres:5432/${POSTGRES_DB:-peptidyle}}
      PLE_S3_ENDPOINT: http://minio:9000
      PLE_S3_REGION: us-east-1
      PLE_PRIVATE_CONTENT_BUCKET: private-content
      PLE_PUBLIC_ASSETS_BUCKET: public-assets
      PLE_STUDENT_RECORDS_BUCKET: student-records
      PLE_TEMP_PROCESSING_BUCKET: temp-processing
      PLE_NATIVE_PLE_WORKER_S3_ACCESS_KEY_ID: ${PLE_NATIVE_PLE_WORKER_S3_ACCESS_KEY_ID:-native-ple-worker-storage-setup-required}
      PLE_NATIVE_PLE_WORKER_S3_SECRET_ACCESS_KEY: ${PLE_NATIVE_PLE_WORKER_S3_SECRET_ACCESS_KEY:-native-ple-worker-storage-setup-required}
    healthcheck:
      test: ["CMD", "/usr/local/bin/peptidyle-api", "--native-ple-worker", "--health-probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    healthcheck:
      test: ["CMD", "/usr/local/bin/peptidyle-api", "--native-ple-worker", "--health-probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    restart: on-failure
    stop_grace_period: 30s
    networks:
      - default

  webwork-worker:
    labels: *ple-disposable-capability-label
    image: ${PLE_APPLICATION_IMAGE:-localhost/peptidyle-learning-engine:local}
    command: ["--webwork-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      identity-secret-init:
        condition: service_completed_successfully
      webwork-renderer:
        condition: service_healthy
    environment:
      PLE_STORAGE_TOPOLOGY: ${PLE_STORAGE_TOPOLOGY:?set PLE_STORAGE_TOPOLOGY in the env file}
      DATABASE_URL: ${PLE_WEBWORK_WORKER_DATABASE_URL:-postgres://ple_webwork_worker_login:service-login-setup-required@postgres:5432/${POSTGRES_DB:-peptidyle}}
      PLE_S3_ENDPOINT: http://minio:9000
      PLE_S3_REGION: us-east-1
      PLE_PRIVATE_CONTENT_BUCKET: private-content
      PLE_PUBLIC_ASSETS_BUCKET: public-assets
      PLE_STUDENT_RECORDS_BUCKET: student-records
      PLE_TEMP_PROCESSING_BUCKET: temp-processing
      PLE_WEBWORK_WORKER_S3_ACCESS_KEY_ID: ${PLE_WEBWORK_WORKER_S3_ACCESS_KEY_ID:-webwork-worker-storage-setup-required}
      PLE_WEBWORK_WORKER_S3_SECRET_ACCESS_KEY: ${PLE_WEBWORK_WORKER_S3_SECRET_ACCESS_KEY:-webwork-worker-storage-setup-required}
      PLE_WEBWORK_RENDERER_BASE_URL: http://webwork-renderer:3000/
      PLE_WEBWORK_REQUEST_TIMEOUT_SECONDS: ${PLE_WEBWORK_REQUEST_TIMEOUT_SECONDS:-15}
      PLE_WEBWORK_MAX_RESPONSE_BYTES: ${PLE_WEBWORK_MAX_RESPONSE_BYTES:-1048576}
      PLE_WEBWORK_RENDERER_ID: ${PLE_WEBWORK_RENDERER_ID:-vosslab-webwork-pg-renderer}
      PLE_WEBWORK_RENDERER_VERSION_FILE: /run/ple-secrets/question-renderer-version
    volumes:
      - ple_identity_runtime:/run/ple-secrets:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/peptidyle-api", "--webwork-worker", "--health-probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cpus: "0.25"
    mem_limit: 192m
    pids_limit: 64
    restart: on-failure
    stop_grace_period: 30s
    networks:
      - default
      - renderer_private

  # A one-shot dedicated publisher. It receives neither API credentials nor a
  # listener/gateway network; deployment assigns its object-store identity only
  # private restricted-asset read and immutable public-asset creation rights.
  # The profile makes lifecycle invocation explicit after a pending registry
  # record exists rather than turning this into a generic background worker.
  public-asset-publisher:
    labels: *ple-disposable-capability-label
    profiles: ["publisher"]
    image: ${PLE_APPLICATION_IMAGE:-localhost/peptidyle-learning-engine:local}
    command: ["--public-asset-publisher"]
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      PLE_STORAGE_TOPOLOGY: ${PLE_STORAGE_TOPOLOGY:?set PLE_STORAGE_TOPOLOGY in the env file}
      DATABASE_URL: ${PLE_PUBLISHER_DATABASE_URL:-postgres://ple_publisher_login:service-login-setup-required@postgres:5432/${POSTGRES_DB:-peptidyle}}
      PLE_S3_ENDPOINT: http://minio:9000
      PLE_S3_REGION: us-east-1
      PLE_PUBLIC_ASSETS_BUCKET: public-assets
      PLE_PRIVATE_CONTENT_BUCKET: private-content
      PLE_STUDENT_RECORDS_BUCKET: student-records
      PLE_TEMP_PROCESSING_BUCKET: temp-processing
      # The local controller replaces these fail-closed sentinels only after
      # provisioning the publisher's narrow MinIO policy. They intentionally
      # never inherit the API's root credentials.
      PLE_PUBLISHER_S3_ACCESS_KEY_ID: ${PLE_PUBLISHER_S3_ACCESS_KEY_ID:-publisher-storage-setup-required}
      PLE_PUBLISHER_S3_SECRET_ACCESS_KEY: ${PLE_PUBLISHER_S3_SECRET_ACCESS_KEY:-publisher-storage-setup-required}
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 64
    restart: "no"
    networks:
      - default

  gateway:
    labels: *ple-disposable-capability-label
    build:
      context: ..
      dockerfile: containers/Containerfile.gateway
      args:
        CADDY_IMAGE: docker.io/library/caddy@sha256:${PLE_GATEWAY_IMAGE_SHA256:?set PLE_GATEWAY_IMAGE_SHA256 to the selected official Caddy Linux image manifest digest}
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${PLE_GATEWAY_HOST_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../dist
        target: /srv/peptidyle
        read_only: true
        bind:
          create_host_path: false
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /config:rw,noexec,nosuid,size=16m
      - /data:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 64
    restart: on-failure
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "2",
          "http://127.0.0.1:8080/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - gateway_api

  # PLE uses only the standalone PG rendering engine. It has no assignment,
  # course, roster, login, session, SQL, or persistent-volume state.
  webwork-renderer:
    labels: *ple-disposable-capability-label
    # The selected environment owns this name. The launcher records the
    # resolved immutable OCI configuration ID for the exact running instance.
    image: ${PLE_WEBWORK_RENDERER_IMAGE:?renderer image is required}
    environment:
      PERL5LIB: /usr/app/lib/PG:/usr/app/lib/WeBWorK/lib:/usr/app/lib
      MOJO_MODE: production
      problemJWTsecret: ${PLE_WEBWORK_PROBLEM_JWT_SECRET:?renderer problem JWT secret is required}
      webworkJWTsecret: ${PLE_WEBWORK_SESSION_JWT_SECRET:?renderer session JWT secret is required}
      SITE_HOST: http://webwork-renderer:3000
      baseURL: ""
      formURL: /render-api
      STRICT_JWT: "0"
    volumes:
      - type: bind
        source: ./webwork/render_app.conf
        target: /usr/app/render_app.conf
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The renderer evaluates instructor-authored PG/PGML and must not retain
    # authority outside its explicitly writable, ephemeral directories.
    user: "10001:10001"
    read_only: true
    tmpfs:
      # Compose/Podman portable tmpfs options cannot set a mount owner. Sticky
      # directories let the fixed non-root UID write without granting one
      # renderer request authority over another's files.
      - /usr/app/private:rw,noexec,nosuid,size=16m,mode=1777
      - /usr/app/logs:rw,noexec,nosuid,size=16m,mode=1777
      - /usr/app/tmp:rw,noexec,nosuid,size=128m,mode=1777
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    restart: on-failure
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:3000/health/",
        ]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - renderer_private

volumes:
  ple_pgdata:
    labels: *ple-disposable-capability-label
  ple_miniodata:
    labels: *ple-disposable-capability-label
  ple_identity_runtime:
    labels: *ple-disposable-capability-label

networks:
  default:
    labels: *ple-disposable-capability-label
    # PostgreSQL, MinIO, worker, and setup jobs never require Internet access.
    internal: true
  gateway_api:
    labels: *ple-disposable-capability-label
    internal: true
  renderer_private:
    labels: *ple-disposable-capability-label
    internal: true
  api_outbound:
    labels: *ple-disposable-capability-label
