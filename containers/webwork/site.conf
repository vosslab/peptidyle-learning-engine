# This is an override fragment appended to upstream `site.conf.dist` by the
# entrypoint. Keeping the complete upstream baseline preserves program paths,
# file locations, and settings that a partial replacement would lose.
$webwork_url = '/webwork2';
$server_root_url = $ENV{WEBWORK_ROOT_URL};
$database_driver = 'MariaDB';
$database_host = $ENV{WEBWORK_DB_HOST};
$database_port = $ENV{WEBWORK_DB_PORT};
$database_name = $ENV{WEBWORK_DB_NAME};
$database_username = $ENV{WEBWORK_DB_USER};
$database_password = $ENV{WEBWORK_DB_PASSWORD};
$server_userID = 'www-data';
$server_groupID = 'www-data';
$siteDefaults{timezone} = $ENV{WEBWORK_TIMEZONE};
1;
