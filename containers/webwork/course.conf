#!perl
# This private course has one noninteractive, password-authenticated service
# account. Upstream's course-local setting avoids an impossible TOTP prompt;
# source rendering still requires the dedicated proctor permission below.
$twoFA{enabled} = 0;
$permissionLevels{webservice_render_problem} = 'login_proctor';
$permissionLevels{webservice_render_source} = 'login_proctor';
1;
