[workspace]
members = [
    "crates/question_model",
    "crates/domain",
    "crates/grading",
    "crates/objects",
    "crates/store",
    "crates/adapters/native",
    "crates/adapters/webwork",
    "crates/adapters/qti",
    "crates/adapters/h5p",
    "crates/export",
    "crates/wasm",
    "crates/server",
    # Build tooling, not part of the product boundary.
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# External crates shared across workspace members. A member opts in with
# `<name>.workspace = true`; nothing is inherited implicitly.
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
rand_chacha = "0.9"
rand_core = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

# TypeScript definitions for the browser client are generated by crates/xtask,
# not by a codegen dependency in the model crate. Two reasons: `question_model`
# stays free of build tooling, and we control the emitted formatting, which has
# to pass `prettier --check` unchanged. `syn` is the parser that reads the Rust
# model; it is the same parser the compiler ecosystem builds on.
syn = { version = "2", features = ["full", "extra-traits"] }

# UUIDv7 for external identifiers: random enough that a catalog number leaks no
# volume information, time-ordered enough to index well. Never sequential.
#
# No `v7` feature here on purpose. `v7` pulls a random number generator, and on
# wasm32 that fails to build without an explicit browser randomness source.
# That build error is telling the truth: the browser does not mint identifiers.
# A ProblemId is constructed on the publish transition, server-side. Generation
# is therefore gated behind `question_model/generate`, which the server enables
# and the WASM bridge does not.
uuid = { version = "1", default-features = false, features = ["serde", "std"] }

# `chrono` is deliberately clock-free: `default-features = false` drops the
# `clock` and `now` features, so no member can read the wall clock. Time enters
# `crates/domain` as a parameter, which is what makes the seed-parity test
# meaningful and lets the crate run in a browser.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

# PostgreSQL access belongs to `crates/store`, which owns the Store trait,
# migrations, and RLS context. No other member declares it.
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "postgres",
], default-features = false }

# Internal workspace members. The dependency each crate is allowed to name is
# fixed by the boundary table in docs/active_plans/implementation_plan.md.
question_model = { path = "./crates/question_model" }
domain = { path = "./crates/domain" }
grading = { path = "./crates/grading" }
objects = { path = "./crates/objects" }
store = { path = "./crates/store" }
adapter_native = { path = "./crates/adapters/native" }
adapter_webwork = { path = "./crates/adapters/webwork" }
adapter_qti = { path = "./crates/adapters/qti" }
adapter_h5p = { path = "./crates/adapters/h5p" }
export_crate = { path = "./crates/export" }
wasm_bridge = { path = "./crates/wasm" }
server_core = { path = "./crates/server" }
