# Cargo configuration for this workspace.
#
# Committed, not ignored: this is project configuration in the same sense as
# tsconfig.json. Cargo's caches live in ~/.cargo, never in the repository.

[alias]
# Plain-language front door for repository build, generation, database, and
# fixture commands.
tools = "run --quiet -p project-tools --"

# Regenerate the TypeScript definitions from the Rust question model.  This
# source-only binary intentionally excludes the project-tools runtime graph,
# so contract generation remains available when unrelated runtime dependencies
# have an upstream build issue. Output goes to the ignored root generated/ tree.
tsgen = "run --quiet -p project-tools --no-default-features --bin tsgen --"
