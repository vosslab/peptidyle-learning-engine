# Cargo configuration for this workspace.
#
# Committed, not ignored: this is project configuration in the same sense as
# tsconfig.json. Cargo's caches live in ~/.cargo, never in the repository.

[alias]
# Regenerate the TypeScript definitions from the Rust question model.
# ./build.sh runs this as its tsgen stage; the alias is for running it alone
# while iterating on the model.
tsgen = "run --quiet -p xtask -- tsgen"
