# Browser addressing and identity fixtures for the canonical disposable Live Demo.
# Invoke only with containers/compose.yaml through the owner-locked lifecycle adapter.

services:
  api:
    environment:
      PLE_QTI_RUNTIME_ENABLED: "1"
      PLE_BROWSER_ORIGIN: ${PLE_BROWSER_ORIGIN:?set by e2e_browser_suite_owner.py}
      PLE_TRUSTED_PROXY_CIDRS: ${PLE_TRUSTED_PROXY_CIDRS:?set by e2e_browser_suite_owner.py}
      PLE_LIVE_DEMO_ELENA_INSTRUCTOR_ACCOUNT_ID: ${PLE_LIVE_DEMO_ELENA_INSTRUCTOR_ACCOUNT_ID:-}
      PLE_LIVE_DEMO_PRIYA_INSTRUCTOR_ACCOUNT_ID: ${PLE_LIVE_DEMO_PRIYA_INSTRUCTOR_ACCOUNT_ID:-}
      PLE_LIVE_DEMO_MARY_STUDENT_ACCOUNT_ID: ${PLE_LIVE_DEMO_MARY_STUDENT_ACCOUNT_ID:-}
      PLE_LIVE_DEMO_JACK_STUDENT_ACCOUNT_ID: ${PLE_LIVE_DEMO_JACK_STUDENT_ACCOUNT_ID:-}
      PLE_LIVE_DEMO_AVERY_STUDENT_ACCOUNT_ID: ${PLE_LIVE_DEMO_AVERY_STUDENT_ACCOUNT_ID:-}
      PLE_LIVE_DEMO_MORGAN_SYSADMIN_ACCOUNT_ID: ${PLE_LIVE_DEMO_MORGAN_SYSADMIN_ACCOUNT_ID:-}
  gateway:
    # Browser acceptance adds only the disposable storage-network attachment.
    # TLS, routing, headers, readiness, and production-bundle delivery all come
    # from the canonical containers/Caddyfile mounted by the base composition.
    networks:
      - default

networks:
  gateway_api:
    ipam:
      config:
        - subnet: 172.30.255.0/29
