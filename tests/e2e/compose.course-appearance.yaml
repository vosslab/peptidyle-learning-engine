# Disposable PostgreSQL and MinIO oracle for course-appearance acceptance.
# The launcher supplies a unique project, credentials, ports, and volumes.
x-ple-disposable-capability-label: &ple-disposable-capability-label
  org.peptidyle.disposable.capability-sha256: "${PLE_DISPOSABLE_CAPABILITY_SHA256:?set by the disposable owner}"

services:
  postgres:
    labels: *ple-disposable-capability-label
    image: docker.io/library/postgres@sha256:${PLE_POSTGRES_IMAGE_SHA256:?set by the canonical stack selection}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set by e2e_course_appearance.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by e2e_course_appearance.sh}
      POSTGRES_DB: ${POSTGRES_DB:?set by e2e_course_appearance.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${PLE_POSTGRES_HOST_PORT:?set by e2e_course_appearance.sh}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    labels: *ple-disposable-capability-label
    image: quay.io/minio/minio@sha256:${PLE_MINIO_IMAGE_SHA256:?set by the canonical stack selection}
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set by e2e_course_appearance.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set by e2e_course_appearance.sh}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${PLE_MINIO_API_HOST_PORT:?set by e2e_course_appearance.sh}:9000"
    volumes:
      - minio_data:/data

  createbuckets:
    labels: *ple-disposable-capability-label
    image: quay.io/minio/mc@sha256:${PLE_MINIO_MC_IMAGE_SHA256:?set by the canonical stack selection}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set by e2e_course_appearance.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set by e2e_course_appearance.sh}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/public-assets
        mc mb --ignore-existing local/private-content
        mc mb --ignore-existing local/student-records
        mc mb --ignore-existing local/temp-processing

volumes:
  postgres_data:
    labels: *ple-disposable-capability-label
  minio_data:
    labels: *ple-disposable-capability-label

networks:
  default:
    labels: *ple-disposable-capability-label
