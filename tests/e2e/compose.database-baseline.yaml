# Disposable PostgreSQL-only E2E environment.
#
# This intentionally mirrors the postgres service in containers/compose.yaml
# without evaluating unrelated API, object-store, or renderer configuration.
# Its Compose project name and credentials are generated by
# e2e_database_baseline.sh and never shared with local development services.
services:
  postgres:
    image: docker.io/library/postgres@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set by e2e_database_baseline.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by e2e_database_baseline.sh}
      POSTGRES_DB: ${POSTGRES_DB:?set by e2e_database_baseline.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${PLE_POSTGRES_HOST_PORT:?set by e2e_database_baseline.sh}:5432"
