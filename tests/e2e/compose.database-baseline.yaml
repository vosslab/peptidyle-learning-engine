# Disposable PostgreSQL-only E2E environment.
#
# This intentionally mirrors the postgres service in containers/compose.yaml
# without evaluating unrelated API, object-store, or renderer configuration.
# It is a database-only profile of the fixed live-demo browser owner. The
# lease-held owner generates its credentials and removes the complete profile
# before another browser or acceptance workflow can begin.
x-ple-disposable-capability-label: &ple-disposable-capability-label
  org.peptidyle.disposable.capability-sha256: "${PLE_DISPOSABLE_CAPABILITY_SHA256:?set by the disposable owner}"

x-ple-e2e-owner-label: &ple-e2e-owner-label
  org.peptidyle.e2e.owner: "${PLE_E2E_OWNER:?set by the fixed browser-suite owner}"

services:
  postgres:
    labels:
      <<: [*ple-disposable-capability-label, *ple-e2e-owner-label]
    image: docker.io/library/postgres@sha256:${PLE_POSTGRES_IMAGE_SHA256:?set by the canonical stack selection}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set by e2e_database_baseline.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by e2e_database_baseline.sh}
      POSTGRES_DB: ${POSTGRES_DB:?set by e2e_database_baseline.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${PLE_POSTGRES_HOST_PORT:?set by e2e_database_baseline.sh}:5432"
    volumes:
      - ple_pgdata:/var/lib/postgresql/data

volumes:
  ple_pgdata:
    labels:
      <<: [*ple-disposable-capability-label, *ple-e2e-owner-label]

networks:
  default:
    labels:
      <<: [*ple-disposable-capability-label, *ple-e2e-owner-label]
