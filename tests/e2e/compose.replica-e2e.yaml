# Future two-API replica test override. It selects the API binary whose
# compile-time observability feature is intentionally absent from the normal
# image, then turns that feature on at runtime for its isolated stack.
#
# Invoke only through the fixed live-demo replica profile after the production
# auth overlay. The lease-held owner supplies loopback ports and lifecycle;
# this file never creates credentials, identity, educational data, or a seed endpoint.
services:
  api:
    build:
      target: e2e-observability
    environment:
      PLE_ENABLE_E2E_OBSERVABILITY: "1"
