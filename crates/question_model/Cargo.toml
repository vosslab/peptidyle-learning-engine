# MOD-QM: question types, capabilities, identity, and taxonomy.
# Boundary rule: depends on external crates only, never on another member.
[package]
name = "question_model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Deliberately minimal. TypeScript definitions are generated by
# crates/project-tools,
# which reads this crate's source, so no codegen dependency sits on the
# product's root contract.
serde.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom = { workspace = true, optional = true }

# Optional so the WASM bridge can enable it without forcing it on the server.
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
# Tests assert on the exact JSON shape, because that shape is the contract the
# browser client and every adapter read.
serde_json.workspace = true

[features]
default = []
wasm = ["dep:wasm-bindgen"]

# Identifier *generation*, as opposed to carrying and parsing identifiers.
# Server-side only: minting a new ID is part of the publish transition, and the
# browser has no business doing it. Keeping this off by default is also what
# lets the crate build for wasm32, where uuid's RNG needs a browser randomness
# source it should never have.
generate = ["uuid/v7", "dep:getrandom"]
