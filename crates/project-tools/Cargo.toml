# Project tools: repository automation that needs to be a Rust program rather
# than a shell script. Contributors invoke the package through `cargo tools`.
# It is not part of the product boundary in docs/CODE_ARCHITECTURE.md and never
# a dependency of any shipped crate.
#
# The runtime host owns repository automation that needs Rust, including
# wasm-bindgen glue generation. The source-only `cargo tsgen` binary is a
# separate capability: it parses Rust contracts without pulling the runtime
# host's database, object-store, or server dependencies.
[package]
name = "project-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "project-tools"

[features]
# `cargo tools` remains the complete maintainer command host.  The separate
# `cargo tsgen` binary deliberately leaves this feature disabled because it
# only parses Rust source into browser declarations and must not pull the
# database, object-store, or server runtime graph into that check.
default = ["runtime-tools"]
runtime-tools = [
    "dep:acceptance-runtime",
    "dep:adapter_ple",
    "dep:adapter_webwork",
    "dep:async-trait",
    "dep:base64",
    "dep:csv",
    "dep:domain",
    "dep:getrandom",
    "dep:grading",
    "dep:learning-data-access",
    "dep:objects",
    "dep:percent-encoding",
    "dep:question_model",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_yaml_ng",
    "dep:server_core",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "dep:url",
    "dep:uuid",
    "dep:wasm-bindgen-cli-support",
]

[[bin]]
name = "project-tools"
path = "src/main.rs"
required-features = ["runtime-tools"]

[[bin]]
name = "tsgen"
path = "src/bin/tsgen.rs"

[dependencies]
acceptance-runtime = { path = "../acceptance-runtime", optional = true }
adapter_ple = { workspace = true, optional = true }
adapter_webwork = { workspace = true, optional = true }
anyhow.workspace = true
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
domain = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
grading = { workspace = true, optional = true }
objects = { workspace = true, features = ["s3"], optional = true }
percent-encoding = { version = "*", optional = true }
# Host-only E2E seeding follows the same production presentation-binding path
# as the server, including OS-backed nonce generation. The browser/WASM bridge
# deliberately does not enable this server-side identity-generation feature.
question_model = { workspace = true, features = ["generate"], optional = true }
learning-data-access = { workspace = true, features = ["postgres"], optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
serde_yaml_ng = { workspace = true, optional = true }
server_core = { path = "../server", optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
syn.workspace = true
tokio = { workspace = true, optional = true }
url = { version = "*", optional = true }
uuid = { workspace = true, optional = true }
wasm-bindgen-cli-support = { version = "*", optional = true }

[dev-dependencies]
# E2E seed tests use the deliberate non-production in-memory backend.
learning-data-access = { workspace = true, features = ["test-support"] }
