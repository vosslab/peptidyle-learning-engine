# Project tools: repository automation that needs to be a Rust program rather
# than a shell script. Contributors invoke the package through `cargo tools`.
# It is not part of the product boundary in docs/CODE_ARCHITECTURE.md and never
# a dependency of any shipped crate.
#
# The one job today is generating the wasm-bindgen JavaScript glue. Doing it
# through the library rather than an installed `wasm-bindgen` binary means the
# generator and the `wasm-bindgen` crate compiled into the module come from the
# same Cargo.lock entry, so they cannot drift apart. A mismatched pair fails at
# load time with an error that names neither version.
[package]
name = "project-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
acceptance-runtime = { path = "../acceptance-runtime" }
adapter_native.workspace = true
adapter_webwork.workspace = true
anyhow.workspace = true
base64.workspace = true
base_course_installation.workspace = true
csv.workspace = true
domain.workspace = true
grading.workspace = true
objects = { workspace = true, features = ["s3"] }
# Host-only E2E seeding follows the same production presentation-binding path
# as the server, including OS-backed nonce generation. The browser/WASM bridge
# deliberately does not enable this server-side identity-generation feature.
question_model = { workspace = true, features = ["generate"] }
learning-data-access = { workspace = true, features = ["postgres"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
syn.workspace = true
tokio.workspace = true
url = "*"
uuid.workspace = true
wasm-bindgen-cli-support = "*"
