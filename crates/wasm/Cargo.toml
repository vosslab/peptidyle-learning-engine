# MOD-WASM: wasm-bindgen bridge. Every call delegates to `domain`.
# Security boundary: `grading` is absent from this dependency closure on
# purpose. Adding it here is the one change that would put answer keys in the
# browser, so it must fail review and the closure test in WP-C6.
[package]
name = "wasm_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
question_model.workspace = true
domain.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[features]
default = []
web = ["domain/wasm", "question_model/wasm"]
