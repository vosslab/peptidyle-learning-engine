# Learning data access: Store traits, PostgreSQL, jobs, migrations, and RLS context.
# This crate owns the database driver; no other member declares `sqlx`.
[package]
name = "learning-data-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
browser-api-contract.workspace = true
question_model.workspace = true
domain.workspace = true
objects.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
getrandom.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
bigdecimal.workspace = true
grading.workspace = true
idna.workspace = true
tracing = "*"

# Enabled by the `postgres` feature; the in-memory backend has no database dependency.
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:sqlx", "dep:tokio"]

