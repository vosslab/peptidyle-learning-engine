# Learning data access: Store trait, in-memory backend, PostgreSQL, jobs,
# migrations, RLS context, and backend conformance tests.
# This crate owns the database driver; no other member declares `sqlx`.
[package]
name = "learning-data-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
question_model.workspace = true
domain.workspace = true
objects.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
getrandom.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
bigdecimal.workspace = true
grading.workspace = true
idna.workspace = true

# Enabled by the `postgres` feature; the in-memory backend has no database dependency.
sqlx = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:sqlx"]
# Explicit non-production in-memory backend and test seam for focused conformance
# and server-boundary tests. Production compositions never enable this feature.
test-support = ["question_model/generate"]

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["test-support"]

[[test]]
name = "course_creation_memory"
path = "tests/course_creation_memory.rs"
required-features = ["test-support"]

[dev-dependencies]
tokio.workspace = true
uuid.workspace = true
acceptance-runtime = { path = "../acceptance-runtime" }
adapter_native = { path = "../adapters/native" }
