# Learning data access: Store trait, in-memory backend, PostgreSQL, jobs,
# migrations, RLS context, and backend conformance tests.
# This crate owns the database driver; no other member declares `sqlx`.
[package]
name = "learning-data-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
question_model.workspace = true
domain.workspace = true
objects.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
getrandom.workspace = true
base64.workspace = true
rust_decimal.workspace = true
grading.workspace = true

# Enabled by the `postgres` feature so `MemoryStore` builds without a database.
sqlx = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:sqlx"]
# Enables test-only legacy-record injection for server boundary tests. Production
# compositions never enable it, so it cannot create a persistence bypass.
test-support = []

[dev-dependencies]
tokio.workspace = true
uuid.workspace = true
adapter_native = { path = "../adapters/native" }
