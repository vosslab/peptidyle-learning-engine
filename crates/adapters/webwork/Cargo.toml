# WeBWorK PG Question Backend adapter, renderer client, and deterministic render cache.
[package]
name = "adapter_webwork"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
question_model.workspace = true
domain.workspace = true
grading.workspace = true
# The render cache stores renderer output as objects.
objects.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
async-trait.workspace = true
base64.workspace = true
# This private-service client deliberately owns its HTTP dialect here rather
# than leaking a renderer protocol into the adapter's shared contracts.
reqwest = { version = "*", default-features = false, features = ["form", "json", "rustls"] }
tokio.workspace = true
url = "*"
html5ever.workspace = true
tracing = "*"

[dev-dependencies]
