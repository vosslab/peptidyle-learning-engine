# MOD-ADP-IMATHAS: immutable-source, server-brokered iMathAS adapter.
[package]
name = "adapter_imathas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# Local/dev server tests only. Production composition must not enable this.
test-support = []
# Adapter-owned private provider client. Server composition must opt in.
http-transport = ["dep:reqwest"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
hmac.workspace = true
objects.workspace = true
question_model.workspace = true
learning-data-access.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
reqwest = { version = "*", default-features = false, features = ["json", "rustls"], optional = true }

[dev-dependencies]
tokio.workspace = true
axum.workspace = true
