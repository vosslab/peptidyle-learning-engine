# MOD-ADP-QTI: QTI import pipeline and export, with original-package archival.
[package]
name = "adapter_qti"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
question_model.workspace = true
domain.workspace = true
grading.workspace = true
# The original imported ZIP is archived so the package stays re-importable.
objects.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
html5ever.workspace = true
# ZIP parsing is deliberately confined to this hostile-input adapter.  The
# adapter applies its own path, entry-count, and expanded-size policy before
# any QTI XML is inspected.
zip = { version = ">=6.0.0", default-features = false, features = ["deflate"] }
# `xmlparser` is a tokenizing XML parser.  The importer builds a deliberately
# small tree on top of it so QTI support remains explicit while malformed XML,
# DTDs, and entities are rejected before conversion.
xmlparser = ">=0.13.6"
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
