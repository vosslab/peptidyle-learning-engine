# MOD-ADP-QTI: QTI import pipeline and export, with original-package archival.
[package]
name = "adapter_qti"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
question_model.workspace = true
domain.workspace = true
grading.workspace = true
# The original imported ZIP is archived so the package stays re-importable.
objects.workspace = true
serde.workspace = true

# No XML parsing crate. QTI parsing is written here, in this crate, so the
# rejection rules for hostile input are ours to state and test rather than
# inherited from a general-purpose parser's defaults. See parser_stub.rs for
# what that obliges us to handle, and the M4 hostile-corpus gate that proves
# it. Reference material: ~/nsh/PROBLEMS/qti-package-maker/ (consult at
# MOD-ADP-QTI entry, not before).
