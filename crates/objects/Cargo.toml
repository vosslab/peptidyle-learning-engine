# MOD-OBJ: ObjectStore trait, key construction, checksums, S3 and MinIO backends.
[package]
name = "objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Identity types build every object key; callers never supply a key.
question_model.workspace = true
async-trait.workspace = true
serde.workspace = true
sha2.workspace = true
uuid.workspace = true
# Every user-supplied instructional image crosses this crate's object boundary.
# Keep the hostile-image decoder policy below the server and import adapters so
# no publication path can accidentally choose a weaker parser.
image.workspace = true

# Enabled by the `s3` feature so the memory backend needs no AWS types. Select
# the modern HTTP 1.x client explicitly: the SDK's default feature set also
# enables its legacy Rustls 0.21 client and its vulnerable rustls-webpki line.
#
# TODO(RUSTSEC-2026-0253): upgrade after the current `aws-sdk-s3` release accepts
# `lru >=0.18.2`. The SDK currently requires `lru ^0.16.3`; its only cache key
# is an internal `String` wrapper in the S3 Express identity cache and it does
# not call the advisory's `LruCache::pop()` API. Do not suppress the advisory:
# keep it visible until an upstream SDK release removes the transitive version.
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
aws-sdk-s3 = { version = "*", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
], optional = true }
aws-config = { version = "*", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
], optional = true }

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:base64", "dep:serde_json"]

[dev-dependencies]
acceptance-runtime = { path = "../acceptance-runtime" }
tokio.workspace = true
serde_json.workspace = true
