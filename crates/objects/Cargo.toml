# MOD-OBJ: ObjectStore trait, key construction, checksums, S3 and MinIO backends.
[package]
name = "objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Identity types build every object key; callers never supply a key.
question_model.workspace = true
async-trait.workspace = true
serde.workspace = true
sha2.workspace = true
uuid.workspace = true

# Enabled by the `s3` feature so the memory backend needs no AWS types. Select
# the modern HTTP 1.x client explicitly: the SDK's default feature set also
# enables its legacy Rustls 0.21 client and its vulnerable rustls-webpki line.
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
aws-sdk-s3 = { version = ">=1.141.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
], optional = true }

[features]
default = []
s3 = ["dep:aws-sdk-s3", "dep:base64", "dep:serde_json"]

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
