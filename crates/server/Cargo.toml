# Axum routes, authentication, worker mode, and composition root.
# The only member allowed to depend on every crate above it.
[package]
name = "server_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Enables the disposable PostgreSQL/MinIO topology used by connected local
# demonstrations. It does not enable the local file-backed identity provider.
local-disposable-storage = []
# Compiles the strictly opt-in response attribution used only by the
# container-replica E2E harness.  Production images deliberately do not
# enable it, and enabling the feature alone still exposes nothing.
e2e-observability = []
# Builds the isolated, disposable-stack-only deterministic grader exception
# capability used by the connected recovery acceptance journey.  The ordinary
# API and worker binaries omit this feature and therefore expose no fault
# process mode or recovery-only fast-path composition.
e2e-grader-fault = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
tokio.workspace = true
base64.workspace = true
cookie.workspace = true
csv.workspace = true
getrandom.workspace = true
hmac.workspace = true
image.workspace = true
lettre.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "*"
chacha20poly1305.workspace = true
uuid.workspace = true
libc = "*"
tracing = "*"
tracing-subscriber = "*"
url.workspace = true

# `generate` turns on identifier minting, which happens on the publish
# transition and nowhere else. The WASM bridge deliberately does not enable it.
question_model = { workspace = true, features = ["generate"] }
domain.workspace = true
grading.workspace = true
adapter_ple.workspace = true
adapter_webwork.workspace = true
adapter_imathas = { workspace = true, features = ["http-transport"] }
adapter_qti.workspace = true
# Feature flags, not direct dependencies: the sqlx driver stays inside
# `learning-data-access`
# and the AWS SDK stays inside `objects`, so this crate never names either.
objects = { workspace = true, features = ["s3"] }
learning-data-access = { workspace = true, features = ["postgres"] }

[dev-dependencies]
tower.workspace = true
futures-core = "*"
acceptance-runtime = { path = "../acceptance-runtime" }
zip = { version = "*", default-features = false, features = ["deflate"] }
learning-data-access = { workspace = true, features = ["test-support"] }
adapter_imathas = { workspace = true, features = ["test-support"] }
