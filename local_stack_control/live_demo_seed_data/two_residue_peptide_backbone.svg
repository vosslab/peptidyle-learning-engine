<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="two-residue-title two-residue-description">
  <title id="two-residue-title">Simplified two-residue peptide backbone</title>
  <desc id="two-residue-description">A left-to-right peptide backbone with two alpha carbons, two side chains, an amino terminus, a carboxyl terminus, and a central carbonyl carbon to nitrogen connection.</desc>
  <defs>
    <style>
      .bond { fill: none; stroke: #172033; stroke-linecap: round; stroke-linejoin: round; }
      .backbone-bond { stroke-width: 5; }
      .carbonyl-bond { stroke-width: 3.2; }
      .sidechain-bond { stroke-width: 3; }
      .atom { fill: #172033; font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .carbon { fill: #172033; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .group-label { fill: #46536b; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .terminus-label { fill: #46536b; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; }
    </style>
  </defs>

  <g id="background" aria-hidden="true">
    <rect x="0" y="0" width="560" height="320" fill="#ffffff"/>
  </g>

  <g id="backbone" aria-label="Two residue backbone">
    <g id="residue-one" aria-label="First residue">
      <line id="amino-to-alpha-one" class="bond backbone-bond" x1="79" y1="166" x2="151" y2="166"/>
      <line id="alpha-one-to-carbonyl-one" class="bond backbone-bond" x1="181" y1="166" x2="249" y2="166"/>
      <line id="alpha-one-sidechain" class="bond sidechain-bond" x1="166" y1="148" x2="166" y2="95"/>
      <line id="carbonyl-one-oxygen-a" class="bond carbonyl-bond" x1="260" y1="151" x2="260" y2="92"/>
      <line id="carbonyl-one-oxygen-b" class="bond carbonyl-bond" x1="271" y1="151" x2="271" y2="92"/>
      <text id="amino-terminus" class="atom" x="62" y="166">H&#x2082;N</text>
      <text id="alpha-carbon-one" class="carbon" x="166" y="166">C&alpha;</text>
      <text id="sidechain-one" class="atom" x="166" y="72">R¹</text>
      <text id="carbonyl-carbon-one" class="carbon" x="266" y="166">C</text>
      <text id="carbonyl-oxygen-one" class="atom" x="266" y="69">O</text>
    </g>

    <g id="peptide-connection" aria-label="Central backbone connection">
      <line id="carbonyl-one-to-amide-nitrogen" class="bond backbone-bond" x1="282" y1="166" x2="329" y2="166"/>
      <text id="amide-nitrogen" class="atom" x="344" y="166">NH</text>
    </g>

    <g id="residue-two" aria-label="Second residue">
      <line id="amide-nitrogen-to-alpha-two" class="bond backbone-bond" x1="362" y1="166" x2="421" y2="166"/>
      <line id="alpha-two-to-carboxyl" class="bond backbone-bond" x1="451" y1="166" x2="500" y2="166"/>
      <line id="alpha-two-sidechain" class="bond sidechain-bond" x1="436" y1="148" x2="436" y2="95"/>
      <line id="carboxyl-oxygen-a" class="bond carbonyl-bond" x1="510" y1="151" x2="510" y2="111"/>
      <line id="carboxyl-oxygen-b" class="bond carbonyl-bond" x1="521" y1="151" x2="521" y2="111"/>
      <line id="carboxyl-hydroxyl" class="bond sidechain-bond" x1="520" y1="180" x2="529" y2="198"/>
      <text id="alpha-carbon-two" class="carbon" x="436" y="166">C&alpha;</text>
      <text id="sidechain-two" class="atom" x="436" y="72">R&sup2;</text>
      <text id="carboxyl-carbon" class="carbon" x="516" y="166">C</text>
      <text id="carboxyl-oxygen" class="atom" x="516" y="89">O</text>
      <text id="carboxyl-hydroxyl-label" class="atom" x="535" y="215">OH</text>
    </g>
  </g>

  <g id="educational-labels" aria-label="Backbone orientation labels">
    <text id="amino-end-label" class="terminus-label" x="27" y="207">amino terminus</text>
    <text id="carboxyl-end-label" class="terminus-label" x="438" y="249">carboxyl terminus</text>
    <path id="backbone-direction-arrow" d="M72 278 H475" class="bond sidechain-bond" stroke="#6f7d94"/>
    <path id="backbone-direction-arrowhead" d="M475 278 l-12 -8 v16 z" fill="#6f7d94"/>
    <text id="backbone-direction-label" class="group-label" x="274" y="302">peptide backbone direction</text>
  </g>
</svg>
